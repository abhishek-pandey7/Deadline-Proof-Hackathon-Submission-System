# Render Blueprint: New > Blueprint > pick this repo. Secrets marked
# sync: false are asked for once in the dashboard and never stored here.
services:
  - type: web
    name: deadline-crush
    runtime: docker
    plan: free
    region: singapore # same region as the Neon database
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL # Neon direct host (not -pooler): live updates need LISTEN
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: deadline-crush-submissions
      - key: R2_REGION
        value: auto
      - key: STORAGE_CAP_BYTES
        value: "9000000000"
